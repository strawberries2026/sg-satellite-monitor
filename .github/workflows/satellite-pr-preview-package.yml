name: Satellite PR preview package

on:
  pull_request:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - '.github/workflows/satellite-pr-preview-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify preview assets
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s icon.svg
          test -s sw.js
      - name: Upload isolated preview files
        uses: actions/upload-artifact@v4
        with:
          name: satellite-pr-preview
          path: |
            index.html
            manifest.webmanifest
            icon.svg
            sw.js
          if-no-files-found: error
          retention-days: 7
