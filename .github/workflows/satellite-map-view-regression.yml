name: Satellite map view regression
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JS and map controls
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('index.html','utf8');
          for(const id of ['map-sg','map-pb','map-world','singapore','pedra'])assert(html.includes('id="'+id+'"'),'missing '+id);
          const scripts=html.split('<script>').slice(1).map(part=>part.split('</script>')[0]).filter(Boolean);
          scripts.forEach(s=>new vm.Script(s));
          assert(html.includes('function resetSatelliteMapView('));
          assert(html.includes('map.invalidateSize({pan:false})'));
          assert(html.includes("$('map-world').onclick=async()=>"),'Worldwide async loader must be retained');
          assert(html.includes('function showAllSatellites()'));
          assert(html.includes('satellite.propagate('));
          for(const label of ['NORTH AMERICA','SOUTH AMERICA','EUROPE','AFRICA','ASIA','AUSTRALIA','ANTARCTICA','Atlantic Ocean','Indian Ocean','Pacific Ocean'])assert(html.includes("['"+label+"',"),'Missing worldwide label '+label);
          assert(html.includes('interactive:false,keyboard:false'),'World labels must not intercept satellite marker taps');
          assert(html.includes('map.getZoom()<=2'),'Labels must be restricted to world zoom');
          assert(html.includes('map.on(\'zoomend\',updateLabels)'),'World labels must update on zoom');
          console.log('Map controls, Worldwide loader, and satellite propagation preserved');
          NODE
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test PB marker interaction in mobile browser
        run: |
          python3 -m http.server 8765 >/tmp/satellite-test-server.log 2>&1 &
          node - <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>!!document.querySelector('.leaflet-container'),{timeout:30000});
              await page.locator('#map-sg').click();
              await page.waitForTimeout(500);
              const before=await page.locator('#map-visibility-note').innerText();
              assert.match(before,/Singapore view selected/);
              const marker=page.locator('.leaflet-marker-icon[title="Pedra Branca, Singapore reference point"]');
              await marker.waitFor({timeout:15000});
              await marker.click();
              await page.waitForTimeout(350);
              const position=await page.evaluate(()=>{const m=window.__satelliteMapForTests;return {lat:m.getCenter().lat,lon:m.getCenter().lng,zoom:m.getZoom()}});
              assert(Math.abs(position.lat-1.330)<0.02 && Math.abs(position.lon-104.406)<0.02 && position.zoom===9,'PB marker did not centre and zoom the actual Leaflet map: '+JSON.stringify(position));
              const after=await page.locator('#map-visibility-note').innerText();
              assert.match(after,/Pedra Branca view selected/,'PB marker click did not run focus handler');
              const popup=await page.locator('.leaflet-popup-content').allInnerTexts();
              assert(popup.some(t=>t.includes('Pedra Branca')),'PB popup missing');
              await page.locator('#map-world').click();
              await page.waitForTimeout(300);
              const worldNote=await page.locator('#map-visibility-note').innerText();
              assert(!worldNote.includes('Pedra Branca view selected'),'Worldwide remained on PB');
              console.log('Mobile PB marker click, popup, and Worldwide state passed');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
