<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081a2b"><title>SG Satellite Monitor · PWA Check</title><style>body{background:#081a2b;color:#eef7ff;font:16px system-ui;padding:20px;line-height:1.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#17334b;padding:16px;border-radius:12px}button{padding:12px;border-radius:9px}a{color:#8cddff}</style></head><body><h1>PWA installation check</h1><p>Diagnostic only. This page does not change or uninstall the app.</p><button id="check">Run check</button> <button id="copy">Copy report</button><pre id="report">Checking…</pre><p><a href="./">Return to satellite monitor</a></p><script>let report={};async function run(){const m=await fetch('./manifest.webmanifest',{cache:'no-store'}).then(r=>r.json()).catch(e=>({error:String(e)}));const reg='serviceWorker'in navigator?await navigator.serviceWorker.getRegistration('./').catch(()=>null):null;let related='unsupported';if('getInstalledRelatedApps'in navigator){try{related=await navigator.getInstalledRelatedApps()}catch(e){related=String(e)}}report={page:location.href,standalone:matchMedia('(display-mode: standalone)').matches,manifest:{id:m.id||'(not specified)',start_url:m.start_url,scope:m.scope,display:m.display,icons:m.icons},service_worker:reg?reg.active?.state||'registered':'not registered',controlled:!!navigator.serviceWorker?.controller,installed_related_apps:related,checked_at:new Date().toISOString()};document.getElementById('report').textContent=JSON.stringify(report,null,2)}document.getElementById('check').onclick=run;document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(report,null,2));run();</script></body></html>
